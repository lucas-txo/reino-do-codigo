<!DOCTYPE html>
<html lang="pt-br">
<head>

  <title>Reino do Código</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header>
    <h1>Reino do Código</h1>
  </header>
  <main>
    <section>

        <label for="curso">Curso:</label>

            <option>Administração</option>
            <option>Pedagogia</option>

</form>
    </section>
